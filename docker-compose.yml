# Local full stack: PostgreSQL+PostGIS, FastAPI backend, Next.js frontend.
#   cp .env.example .env   (optional: add ORS_API_KEY / ANTHROPIC_API_KEY / CONTACT_EMAIL)
#   docker compose up --build
#   open http://localhost:3000
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: civiclens
      POSTGRES_PASSWORD: civiclens
      POSTGRES_DB: civiclens
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civiclens"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://civiclens:civiclens@db:5432/civiclens
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
